<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <radialGradient id="globeGrad" cx="38%" cy="32%" r="65%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="35%" stop-color="#0284c7" />
      <stop offset="70%" stop-color="#034a78" />
      <stop offset="100%" stop-color="#020b18" />
    </radialGradient>
    <linearGradient id="orbitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="riverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9" />
      <stop offset="50%" stop-color="#a5f3fc" />
      <stop offset="100%" stop-color="#2dd4bf" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Deep Cosmic Badge Background -->
  <rect width="100" height="100" rx="24" fill="#020408" />
  <rect width="98" height="98" x="1" y="1" rx="23" stroke="#06b6d4" stroke-width="1.5" stroke-opacity="0.4" />

  <!-- Outer Radar Calibration Rings -->
  <circle cx="50" cy="50" r="44" stroke="#06b6d4" stroke-width="1.2" stroke-opacity="0.3" stroke-dasharray="3 3" />
  <circle cx="50" cy="50" r="37" stroke="#38bdf8" stroke-width="0.8" stroke-opacity="0.2" />

  <!-- Tilted Elliptical SAR Orbit Ring -->
  <ellipse cx="50" cy="50" rx="42" ry="17" transform="rotate(-28 50 50)" stroke="url(#orbitGrad)" stroke-width="3" stroke-linecap="round" filter="url(#glow)" />

  <!-- Central Planet Earth Globe -->
  <circle cx="50" cy="50" r="26" fill="url(#globeGrad)" stroke="#38bdf8" stroke-width="1.8" filter="url(#glow)" />

  <!-- Atmosphere Corona Ring -->
  <circle cx="50" cy="50" r="28" stroke="#06b6d4" stroke-width="1.2" stroke-opacity="0.5" />

  <!-- River Meander Flow Cutting Across Globe -->
  <path d="M 32 36 Q 44 48, 50 44 T 68 62" fill="none" stroke="url(#riverGrad)" stroke-width="3.5" stroke-linecap="round" filter="url(#glow)" />

  <!-- Secondary River Channel & Emerging Sandbar Island -->
  <path d="M 46 47 Q 56 54, 62 44" fill="none" stroke="#fed7aa" stroke-width="2.2" stroke-linecap="round" />
  <ellipse cx="52" cy="48" rx="4.5" ry="2.2" transform="rotate(-15 52 48)" fill="#fef08a" stroke="#f59e0b" stroke-width="0.9" />

  <!-- Radar Satellite Beacons in Orbit -->
  <circle cx="78" cy="34" r="3.8" fill="#ffffff" filter="url(#glow)" />
  <circle cx="78" cy="34" r="7" stroke="#22d3ee" stroke-width="1.5" stroke-opacity="0.9" />

  <circle cx="22" cy="66" r="3" fill="#f59e0b" />
  <circle cx="22" cy="66" r="5.5" stroke="#f59e0b" stroke-width="1" stroke-opacity="0.7" />

  <!-- Reticle Corner Ticks -->
  <path d="M 50 4 L 50 11" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
  <path d="M 50 89 L 50 96" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
  <path d="M 4 50 L 11 50" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
  <path d="M 89 50 L 96 50" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
</svg>
